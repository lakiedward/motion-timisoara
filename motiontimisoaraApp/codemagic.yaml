workflows:
  ios-build:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 20
      vars:
        XCODE_PROJECT: 'ios/App/App.xcodeproj'
        XCODE_SCHEME: 'App'
    scripts:
      - name: Install dependencies
        script: cd motiontimisoaraApp && npm ci
      - name: Build web + sync iOS
        script: |
          cd motiontimisoaraApp
          npm run build
          npx cap sync ios
      # Capacitor 8 uses Swift Package Manager — no CocoaPods / `pod install` step.
      # Code signing + `xcodebuild archive` + export added in Phase 10 once an
      # Apple Developer account and signing certificates are configured.
