apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.isFile()) {
    signingFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String property, String variable ->
    def value = System.getenv(variable) ?: signingProperties.getProperty(property)
    return value?.trim() ? value.trim() : null
}

def releaseStoreFile = signingValue('storeFile', 'MT_UPLOAD_STORE_FILE')
def releaseStorePassword = signingValue('storePassword', 'MT_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = signingValue('keyAlias', 'MT_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = signingValue('keyPassword', 'MT_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null }

def versionEpoch = java.time.Instant.parse('2026-01-01T00:00:00Z').toEpochMilli()
def appVersionCode = (System.getenv('MT_VERSION_CODE') ?: findProperty('mtVersionCode'))?.toString()?.toInteger()
    ?: (int) ((System.currentTimeMillis() - versionEpoch).intdiv(60000L) + 1)
def appVersionName = (System.getenv('MT_VERSION_NAME') ?: findProperty('mtVersionName') ?: '1.0.0').toString()

android {
    namespace = "com.motiontimisoara.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.motiontimisoara.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "com.google.firebase:firebase-messaging:25.0.1"
    implementation "com.stripe:stripe-android:22.8.1"
    implementation "com.google.android.gms:play-services-wallet:19.4.0"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
