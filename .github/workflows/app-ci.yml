name: App CI

on:
  push:
    branches: [master]
    paths:
      - 'motiontimisoaraApp/**'
      - '.github/workflows/app-ci.yml'
      - 'tests/native-location/**'
      - 'supabase/migrations/00055_camp_announcement_audience.sql'
      - 'supabase/migrations/00056_parent_announcement_feed.sql'
      - 'supabase/tests/*parent-announcement*'
      - 'supabase/migrations/00057_android_parent_push.sql'
      - 'supabase/functions/dispatch-push/**'
      - 'supabase/functions/dispatch-push-contract.test.ts'
      - 'supabase/tests/*push*'
      - 'supabase/migrations/00060_atomic_enrollment_creation.sql'
      - 'supabase/migrations/00061_free_enrollment_fulfillment.sql'
      - 'supabase/migrations/00068_camp_adult_enrollment.sql'
      - 'supabase/functions/create-enrollment/**'
      - 'supabase/functions/validate-enrollment/**'
      - 'supabase/functions/create-payment-intent/**'
      - 'supabase/functions/_shared/payment-*.ts'
      - 'supabase/functions/_shared/enrollment-pricing.ts'
      - 'supabase/functions/_shared/price-snapshot.ts'
      - 'supabase/functions/_shared/price-snapshot.test.ts'
      - 'supabase/functions/enrollment-contract.test.ts'
      - 'supabase/functions/bnr-rate/**'
      - 'supabase/functions/bnr-rate-contract.test.ts'
      - 'supabase/tests/*atomic-enrollment-creation*'
      - 'supabase/tests/*camp-adult*'
  pull_request:
    paths:
      - 'motiontimisoaraApp/**'
      - '.github/workflows/app-ci.yml'
      - 'tests/native-location/**'
      - 'supabase/migrations/00055_camp_announcement_audience.sql'
      - 'supabase/migrations/00056_parent_announcement_feed.sql'
      - 'supabase/tests/*parent-announcement*'
      - 'supabase/migrations/00057_android_parent_push.sql'
      - 'supabase/functions/dispatch-push/**'
      - 'supabase/functions/dispatch-push-contract.test.ts'
      - 'supabase/tests/*push*'
      - 'supabase/migrations/00060_atomic_enrollment_creation.sql'
      - 'supabase/migrations/00061_free_enrollment_fulfillment.sql'
      - 'supabase/migrations/00068_camp_adult_enrollment.sql'
      - 'supabase/functions/create-enrollment/**'
      - 'supabase/functions/validate-enrollment/**'
      - 'supabase/functions/create-payment-intent/**'
      - 'supabase/functions/_shared/payment-*.ts'
      - 'supabase/functions/_shared/enrollment-pricing.ts'
      - 'supabase/functions/_shared/price-snapshot.ts'
      - 'supabase/functions/_shared/price-snapshot.test.ts'
      - 'supabase/functions/enrollment-contract.test.ts'
      - 'supabase/functions/bnr-rate/**'
      - 'supabase/functions/bnr-rate-contract.test.ts'
      - 'supabase/tests/*atomic-enrollment-creation*'
      - 'supabase/tests/*camp-adult*'

jobs:
  enrollment-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Verify atomic enrollment retries and concurrent fulfillment
        shell: pwsh
        run: ./supabase/tests/run-atomic-enrollment-creation.ps1
      - name: Verify camp adult enrollment SQL
        shell: pwsh
        run: ./supabase/tests/run-camp-adult-enrollment.ps1
      - name: Verify enrollment and payment-intent contracts
        run: deno test --no-lock supabase/functions/enrollment-contract.test.ts supabase/functions/_shared/price-snapshot.test.ts supabase/functions/_shared/payment-intent.test.ts supabase/functions/_shared/payment-charge.test.ts supabase/functions/bnr-rate-contract.test.ts

  push-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify push audience, delivery and concurrent claims
        shell: pwsh
        run: ./supabase/tests/run-push-delivery.ps1
      - name: Verify dispatcher and FCM contracts
        run: npx --yes deno test --no-lock supabase/functions/dispatch-push-contract.test.ts

  announcement-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify parent announcement feed and audience isolation
        shell: pwsh
        run: ./supabase/tests/run-parent-announcement-feed.ps1

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motiontimisoaraApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: motiontimisoaraApp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: motiontimisoaraApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motiontimisoaraApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_STRIPE_PUBLISHABLE_KEY: ''
      - run: npx cap sync android
      - name: Test push lifecycle and compile native app and instrumentation
        working-directory: motiontimisoaraApp/android
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: motiontimisoaraApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motiontimisoaraApp/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_STRIPE_PUBLISHABLE_KEY: ''
      - run: npx cap sync ios
      - name: Compile iOS simulator app without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Verify synthetic iOS native location lifecycle
        run: node ../tests/native-location/run-ios-location.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-live-location-${{ github.event_name }}
          path: test-results/ios-live-location/
          retention-days: 30
