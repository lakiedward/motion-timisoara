name: App CI

on:
  push:
    paths:
      - 'motiontimisoaraApp/**'
      - '.github/workflows/app-ci.yml'
      - 'tests/native-location/**'
  pull_request:
    paths:
      - 'motiontimisoaraApp/**'
      - '.github/workflows/app-ci.yml'
      - 'tests/native-location/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motiontimisoaraApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: motiontimisoaraApp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: motiontimisoaraApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motiontimisoaraApp/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_STRIPE_PUBLISHABLE_KEY: ''
      - run: npx cap sync android
      - name: Compile native app and location instrumentation
        working-directory: motiontimisoaraApp/android
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

  ios-build:
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: motiontimisoaraApp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: motiontimisoaraApp/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
          VITE_STRIPE_PUBLISHABLE_KEY: ''
      - run: npx cap sync ios
      - name: Compile iOS simulator app without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Verify synthetic iOS native location lifecycle
        run: node ../tests/native-location/run-ios-location.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ios-live-location-${{ github.event_name }}
          path: test-results/ios-live-location/
          retention-days: 30
