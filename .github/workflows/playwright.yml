name: Playwright Tests

# Suita rula la fiecare push pe master, fără filtru de căi și fără BASE_URL,
# deci pornea și pe commit-uri care ating doar documentația — și cădea de
# fiecare dată, fiindcă ținta implicită era un domeniu mort. Acum pornește doar
# când se schimbă ceva ce testele chiar acoperă.
on:
  push:
    branches: [ main, master ]
    paths:
      - 'motiontimisoaraApp/**'
      - 'tests/**'
      - 'supabase/functions/**'
      - 'supabase/tests/**'
      - 'supabase/migrations/00037_camp_age_pricing.sql'
      - 'supabase/migrations/00041_camp_child_price_server_only.sql'
      - 'supabase/migrations/00042_transactional_attendance.sql'
      - 'supabase/migrations/00043_coach_live_location.sql'
      - 'supabase/migrations/00044_coach_live_location_realtime.sql'
      - 'supabase/migrations/00045_camp_live_location_access.sql'
      - 'supabase/migrations/00046_camp_live_location_transaction.sql'
      - 'supabase/migrations/00047_camp_live_location_discovery.sql'
      - 'supabase/migrations/00048_enrollment_price_snapshots.sql'
      - 'supabase/migrations/00049_atomic_camp_offer_pricing.sql'
      - 'supabase/migrations/0005*.sql'
      - 'supabase/migrations/0006*.sql'
      - 'supabase/migrations/00070_camp_templates.sql'
      - 'supabase/migrations/00071_competition_offers_and_coaches.sql'
      - 'supabase/migrations/00072_competition_registrations.sql'
      - 'supabase/migrations/00073_competition_podium.sql'
      - 'supabase/migrations/00089_club_assets_owner_policies.sql'
      - 'playwright.config.ts'
      - 'playwright.pricing.config.ts'
      - 'playwright.location.config.ts'
      - 'playwright.competition.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'motiontimisoaraApp/**'
      - 'tests/**'
      - 'supabase/functions/**'
      - 'supabase/tests/**'
      - 'supabase/migrations/00037_camp_age_pricing.sql'
      - 'supabase/migrations/00041_camp_child_price_server_only.sql'
      - 'supabase/migrations/00042_transactional_attendance.sql'
      - 'supabase/migrations/00043_coach_live_location.sql'
      - 'supabase/migrations/00044_coach_live_location_realtime.sql'
      - 'supabase/migrations/00045_camp_live_location_access.sql'
      - 'supabase/migrations/00046_camp_live_location_transaction.sql'
      - 'supabase/migrations/00047_camp_live_location_discovery.sql'
      - 'supabase/migrations/00048_enrollment_price_snapshots.sql'
      - 'supabase/migrations/00049_atomic_camp_offer_pricing.sql'
      - 'supabase/migrations/0005*.sql'
      - 'supabase/migrations/0006*.sql'
      - 'supabase/migrations/00070_camp_templates.sql'
      - 'supabase/migrations/00071_competition_offers_and_coaches.sql'
      - 'supabase/migrations/00072_competition_registrations.sql'
      - 'supabase/migrations/00073_competition_podium.sql'
      - 'supabase/migrations/00089_club_assets_owner_policies.sql'
      - 'playwright.config.ts'
      - 'playwright.pricing.config.ts'
      - 'playwright.location.config.ts'
      - 'playwright.competition.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/playwright.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Verificările rulau înșiruite într-un singur job de ~12 minute. Sunt
# independente (fiecare simulare își construiește și își pornește propria
# previzualizare, fiecare test SQL își pornește propriul PostgreSQL), deci rulează
# acum în joburi paralele; durata totală e dată de cel mai lung dintre ele.
jobs:
  competition-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Test isolated competition SQL
      shell: pwsh
      run: ./supabase/tests/run-competition-offers-and-coaches.ps1

  test:
    # ~6 minute măsurate pentru suita principală pe chromium cu un singur
    # worker. 20 lasă loc de instalări și de o rulare lentă.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          package-lock.json
          motiontimisoaraApp/package-lock.json
    - name: Install dependencies
      run: npm ci
    # Suita își construiește și își pornește singură aplicația (webServer din
    # playwright.config.ts), deci are nevoie și de dependențele ei.
    - name: Install app dependencies
      run: npm ci --prefix motiontimisoaraApp
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Fără secrete configurate, aplicația se construiește cu date de
        # substituție: paginile se randează și rutele răspund, dar Supabase nu
        # are cui răspunde. E2E_PLACEHOLDER_BACKEND spune suitei exact asta, ca
        # verificarea care cere un backend viu să se sară cinstit în loc să
        # pice pentru un motiv pe care nimeni nu-l poate repara într-un PR.
        VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
        VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder' }}
        VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
        E2E_PLACEHOLDER_BACKEND: ${{ secrets.VITE_SUPABASE_URL && '0' || '1' }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  browser-simulations:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: |
          package-lock.json
          motiontimisoaraApp/package-lock.json
    - name: Install dependencies
      run: npm ci
    # Suita își construiește și își pornește singură aplicația (webServer din
    # playwright.config.ts), deci are nevoie și de dependențele ei.
    - name: Install app dependencies
      run: npm ci --prefix motiontimisoaraApp
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run isolated checkout pricing simulations
      run: npm run test:checkout-pricing
    - name: Run isolated coach location browser simulations
      run: npx playwright test --config playwright.location.config.ts
    - name: Run isolated competition browser simulations
      run: npm run test:competition
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: browser-simulations
        path: |
          test-results/checkout-pricing/
          test-results/live-location/
          test-results/competition/
        retention-days: 30

  function-contracts:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: npm
    # deno check citește tipurile din node_modules-ul de la rădăcină
    # (@types/node), deci are nevoie de dependențele instalate.
    - name: Install dependencies
      run: npm ci
    - uses: denoland/setup-deno@v2
      with:
        deno-version: v2.9.6
    - name: Check enrollment functions
      run: deno check --no-lock supabase/functions/validate-enrollment/index.ts supabase/functions/create-enrollment/index.ts supabase/functions/create-payment-intent/index.ts supabase/functions/record-attendance/index.ts supabase/functions/coach-live-location/index.ts supabase/functions/bnr-rate/index.ts supabase/functions/purge-expired-media/index.ts
    - name: Test enrollment pricing contract
      run: deno test --no-lock supabase/functions/enrollment-contract.test.ts supabase/functions/_shared/price-snapshot.test.ts supabase/functions/_shared/payment-charge.test.ts supabase/functions/record-attendance-contract.test.ts supabase/functions/coach-live-location-contract.test.ts supabase/functions/camp-live-location-contract.test.ts supabase/functions/bnr-rate-contract.test.ts supabase/functions/purge-expired-media-contract.test.ts
    - name: Test payment confirmation and intent retries
      run: deno test --no-lock supabase/functions/payment-completion-contract.test.ts supabase/functions/_shared/payment-intent.test.ts supabase/functions/_shared/checkout-session.test.ts
    - name: Check competition functions and contracts
      run: deno check --no-lock supabase/functions/create-competition-registration/index.ts supabase/functions/validate-competition-registration/index.ts && deno test --no-lock supabase/functions/competition-registration-contract.test.ts supabase/functions/_shared/competition-payment-recipient.test.ts
    - name: Check payment confirmation functions
      run: deno check --no-lock supabase/functions/mark-cash-paid/index.ts supabase/functions/stripe-webhook/index.ts supabase/functions/cancel-draft-enrollment/index.ts supabase/functions/create-checkout-session/index.ts
    - name: Test isolated camp pricing SQL
      shell: pwsh
      run: ./supabase/tests/run-camp-child-pricing.ps1
    - name: Test isolated enrollment currency snapshots
      shell: pwsh
      run: ./supabase/tests/run-enrollment-price-snapshots.ps1
    - name: Test atomic camp offer pricing
      shell: pwsh
      run: ./supabase/tests/run-atomic-camp-offer-pricing.ps1
    - name: Test isolated camp rules file
      shell: pwsh
      run: ./supabase/tests/run-camp-rules-file.ps1
    - name: Test isolated camp templates
      shell: pwsh
      run: ./supabase/tests/run-camp-templates.ps1
    - name: Test course and activity rules files
      shell: pwsh
      run: ./supabase/tests/run-course-activity-rules-file.ps1
    - name: Test club activity management
      shell: pwsh
      run: ./supabase/tests/run-club-activity-management.ps1
    - name: Test club assets storage ownership
      shell: pwsh
      run: ./supabase/tests/run-club-assets-storage.ps1
    - name: Test course and activity photos storage ownership
      shell: pwsh
      run: ./supabase/tests/run-course-activity-photos-storage.ps1
    - name: Test isolated camp adult enrollment
      shell: pwsh
      run: ./supabase/tests/run-camp-adult-enrollment.ps1
    - name: Test atomic payment completion and concurrent confirmations
      shell: pwsh
      run: ./supabase/tests/run-enrollment-payment-completion.ps1
    - name: Test isolated attendance SQL and concurrent scans
      shell: pwsh
      run: ./supabase/tests/run-transactional-attendance.ps1
    - name: Test isolated coach live location access and lifecycle
      shell: pwsh
      run: ./supabase/tests/run-coach-live-location-realtime.ps1
    - name: Test isolated camp participation and live location
      shell: pwsh
      run: ./supabase/tests/run-camp-live-location.ps1
