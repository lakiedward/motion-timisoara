name: Managed coach contracts

on:
  pull_request:
    paths:
      - 'supabase/functions/create-managed-coach/**'
      - 'supabase/functions/_shared/cors.ts'
      - 'supabase/functions/_shared/supabase.ts'
      - 'supabase/migrations/00079_atomic_coach_invitation.sql'
      - 'supabase/tests/coach-invitation/**'
      - '.github/workflows/managed-coach.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  managed-coach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Verify coach creation and partial failure compensation
        run: deno test --no-lock supabase/functions/create-managed-coach/contract.test.ts
      - name: Typecheck the coach creation entrypoint
        run: deno check --no-lock --node-modules-dir=none supabase/functions/create-managed-coach/index.ts
      - name: Verify invitation expiry and concurrent use limits
        shell: pwsh
        run: ./supabase/tests/coach-invitation/run.ps1
