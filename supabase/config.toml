# Supabase CLI project config.
# Remote project: motion-timisoara (ehdzafadshbaaghzdzdo).
# The project ref is not a secret; keys and the DB password are NOT stored here.
project_id = "ehdzafadshbaaghzdzdo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Local dev serves the React app on 3017 (see .claude/launch.json).
site_url = "http://127.0.0.1:3017"
additional_redirect_urls = ["http://127.0.0.1:3017"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Per-function JWT gating. Written down because `functions deploy` defaults to
# verify_jwt = true, and a single deploy without this file would start rejecting
# Stripe's webhook calls (they carry a Stripe signature, never a Supabase JWT).
#
# false does NOT mean unauthenticated: register-*, contact-form and
# create-managed-coach are called by anonymous or not-yet-existing users and do
# their own authorization inside the handler (create-managed-coach reads the
# Authorization header itself and requires role CLUB or ADMIN), while the two
# webhooks authenticate by verifying Stripe's signature.
[functions.register-coach]
verify_jwt = false

[functions.register-club]
verify_jwt = false

[functions.contact-form]
verify_jwt = false

[functions.create-managed-coach]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.stripe-connect-webhook]
verify_jwt = false

[functions.validate-enrollment]
verify_jwt = true

[functions.create-enrollment]
verify_jwt = true

[functions.cancel-draft-enrollment]
verify_jwt = true

[functions.create-payment-intent]
verify_jwt = true

[functions.mark-cash-paid]
verify_jwt = true

[functions.record-attendance]
verify_jwt = true

[functions.stripe-connect]
verify_jwt = true

[functions.purge-expired-media]
# Chemata de pg_cron cu cheia de service. `verify_jwt` e stratul exterior;
# functia isi verifica oricum cheia explicit, fiindca `verify_jwt` lasa sa treaca
# si cheia anon, care e publica.
verify_jwt = true
