# Supabase CLI project config.
# Remote project: motion-timisoara (ehdzafadshbaaghzdzdo).
# The project ref is not a secret; keys and the DB password are NOT stored here.
project_id = "ehdzafadshbaaghzdzdo"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
# Local dev serves the React app on 3017 (see .claude/launch.json).
site_url = "http://127.0.0.1:3017"
additional_redirect_urls = ["http://127.0.0.1:3017"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083
